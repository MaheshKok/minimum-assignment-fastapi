# Deploy every push to main to Heroku, then pin the commit on New Relic's timeline.
# Secrets (Settings > Secrets): HEROKU_API_KEY, and NEW_RELIC_API_KEY (a User key, NRAK-...).
# Variables (Settings > Variables): HEROKU_APP_NAME, NEW_RELIC_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges deploy one after the other, never on top of each other.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can be started from any branch; only main is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Heroku refuses pushes from a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          remote="https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          if [ "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "Heroku already has $GITHUB_SHA: not pushing again."
          else
            git push "$remote" "$GITHUB_SHA:refs/heads/main"
          fi
      # Always runs, so a re-run repairs a marker a failed run missed; the script skips
      # commits that already have one.
      - name: Mark the deploy in New Relic
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
          DEPLOY_USER: ${{ github.actor }}
          DEPLOY_DESCRIPTION: ${{ github.event.head_commit.message }}
          DEPLOY_LINK: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/mark_deploy.py
